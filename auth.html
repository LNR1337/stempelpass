<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1d4a33"><title>Stempeljagd – Anmelden</title><link rel="icon" href="icon-192.png">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(160deg,#2f6b45,#1d4a33 60%,#14301f);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1b2a21}
.card{background:#fff;border-radius:22px;padding:28px 22px;max-width:340px;width:calc(100% - 40px);text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.3)}
h1{font:700 23px Georgia,serif;margin:10px 0 6px}p{color:#5d6e63;margin:0}
#btn{display:flex;justify-content:center;margin:20px 0 8px;min-height:44px}
.back{display:none;margin-top:12px;background:#1d4a33;color:#fff;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 18px}
small{display:block;margin-top:16px;color:#8a978e;font-size:12px}
</style></head><body>
<div class="card">
  <svg viewBox="0 0 512 512" width="64" height="64" style="border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.15)" aria-hidden="true"><defs><linearGradient id="autg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6b45"/><stop offset="1" stop-color="#16382a"/></linearGradient><radialGradient id="autl"><stop offset="0" stop-color="#e3b542" stop-opacity=".35"/><stop offset="1" stop-color="#e3b542" stop-opacity="0"/></radialGradient></defs>
<rect width="512" height="512" fill="url(#autg)"/><g transform="translate(256 256) scale(.74) translate(-256 -256)">
<circle cx="256" cy="242" r="170" fill="url(#autl)"/>
<circle cx="256" cy="256" r="226" fill="none" stroke="#e3b542" stroke-width="12"/><circle cx="256" cy="256" r="202" fill="none" stroke="#e3b542" stroke-width="5"/>
<path d="M256 440s-130-140-130-236a130 130 0 0 1 260 0c0 96-130 236-130 236z" fill="#16382a" stroke="#e3b542" stroke-width="14" stroke-linejoin="round" transform="translate(256 239) scale(.82) translate(-256 -240)"/><circle cx="256" cy="205" r="58" fill="#e3b542"/><path d="M230 206l19 19 40-44" fill="none" stroke="#16382a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
  <h1>Mit Google anmelden</h1>
  <p id="msg">Wähle dein Google-Konto – danach geht es automatisch zurück in die Stempeljagd-App.</p>
  <div id="btn">Lädt …</div>
  <a id="back" class="back">Zurück zur App</a>
  <small>Stempeljagd bekommt nur deinen Namen und deine E-Mail-Adresse – kein Passwort.</small>
</div>
<script>
const P = new URLSearchParams(location.search), app = P.get("app");
const msg = document.getElementById("msg"), btn = document.getElementById("btn"), back = document.getElementById("back");
const toApp = q => "intent://google?" + q + "#Intent;scheme=stempelpass;package=de.stempelpass.app;end";
fetch("google.json?t=" + Date.now()).then(r => r.json()).then(cfg => {
  if (!cfg.clientId) { msg.textContent = "Die Google-Anmeldung ist noch nicht eingerichtet."; btn.textContent = ""; return; }
  const s = document.createElement("script"); s.src = "https://accounts.google.com/gsi/client";
  s.onload = () => {
    google.accounts.id.initialize({ client_id: cfg.clientId, callback: r => done(r.credential), ux_mode: "popup" });
    btn.innerHTML = ""; google.accounts.id.renderButton(btn, { theme: "filled_blue", size: "large", text: "continue_with", shape: "pill", locale: "de" });
  };
  s.onerror = () => { btn.textContent = "Google ist gerade nicht erreichbar."; };
  document.head.appendChild(s);
}).catch(() => { msg.textContent = "Keine Verbindung."; btn.textContent = ""; });
function done(t){
  btn.innerHTML = "";
  if (!app) { msg.textContent = "Angemeldet. Du kannst dieses Fenster schließen."; return; }
  msg.textContent = "✓ Angemeldet – zurück zur App …";
  back.href = toApp("t=" + encodeURIComponent(t)); back.style.display = "inline-block";
  location.href = back.href;
}
</script></body></html>
